<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>STREAM BOX SIGNUP</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:#0f0f0f;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:20px;
}

.box{
width:100%;
max-width:360px;
background:#1a1a1a;
padding:30px 20px;
border-radius:25px;
border:1px solid #333;
box-shadow:0 0 30px rgba(255,0,0,0.2);
text-align:center;
}

.logo{
font-size:32px;
font-weight:bold;
color:white;
margin-bottom:10px;
}

.logo span{
color:red;
}

.sub{
font-size:14px;
color:#999;
margin-bottom:25px;
}

.input-box{
position:relative;
margin-top:15px;
}

.input-box i{
position:absolute;
left:15px;
top:50%;
transform:translateY(-50%);
color:#888;
}

input{
width:100%;
padding:14px 14px 14px 45px;
border:none;
outline:none;
border-radius:14px;
background:#2b2b2b;
color:white;
font-size:15px;
}

input:focus{
border:1px solid red;
}

button{
width:100%;
padding:14px;
margin-top:20px;
border:none;
border-radius:14px;
background:red;
color:white;
font-size:16px;
font-weight:bold;
cursor:pointer;
transition:0.3s;
}

button:hover{
opacity:0.9;
transform:scale(1.02);
}

#message{
margin-top:15px;
font-size:14px;
font-weight:bold;
min-height:20px;
}

#otpSection{
display:none;
margin-top:15px;
}

.login{
margin-top:20px;
color:#999;
font-size:14px;
}

.login a{
color:red;
text-decoration:none;
font-weight:bold;
}

</style>
</head>

<body>

<div class="box">

<div class="logo">
STREAM <span>BOX</span>
</div>

<div class="sub">
Create New Account
</div>

<!-- SIGNUP SECTION -->

<div id="signupSection">

<div class="input-box">

<i class="fa fa-user"></i>

<input type="text"
id="username"
placeholder="Create Username">

</div>

<div class="input-box">

<i class="fa fa-envelope"></i>

<input type="text"
id="email"
placeholder="Mobile Number Or Email">

</div>

<div class="input-box">

<i class="fa fa-lock"></i>

<input type="password"
id="password"
placeholder="Create Password">

</div>

<button onclick="sendOTP()">

Send OTP

</button>

</div>

<!-- OTP SECTION -->

<div id="otpSection">

<div class="input-box">

<i class="fa fa-key"></i>

<input type="text"
id="otpInput"
placeholder="Enter OTP">

</div>

<button onclick="verifyOTP()">

Verify OTP

</button>

</div>

<div id="message"></div>

<div class="login">

Already have account ?

<a href="LOGIN_PAGE.html">

Login

</a>

</div>

</div>

<script>

/* GLOBAL VARIABLES */

let generatedOTP = "";

/* SEND OTP */

function sendOTP(){

let username =
document.getElementById("username")
.value.trim();

let email =
document.getElementById("email")
.value.trim();

let password =
document.getElementById("password")
.value.trim();

let msg =
document.getElementById("message");

/* EMPTY CHECK */

if(username === "" ||
   email === "" ||
   password === ""){

msg.innerHTML =
"⚠️ Fill All Fields";

msg.style.color =
"orange";

return;

}

/* PASSWORD LENGTH */

if(password.length < 4){

msg.innerHTML =
"⚠️ Password Must Be 4 Characters";

msg.style.color =
"orange";

return;

}

/* GENERATE OTP */

generatedOTP =
Math.floor(
1000 + Math.random()*9000
);

/* DEMO OTP */

alert(
"Your OTP Is : " + generatedOTP
);

msg.innerHTML =
"✅ OTP Sent Successfully";

msg.style.color =
"#00ff66";

/* SHOW OTP BOX */

document.getElementById(
"otpSection"
).style.display = "block";

}

/* VERIFY OTP */

function verifyOTP(){

let username =
document.getElementById("username")
.value.trim();

let email =
document.getElementById("email")
.value.trim();

let password =
document.getElementById("password")
.value.trim();

let otp =
document.getElementById("otpInput")
.value.trim();

let msg =
document.getElementById("message");

/* OTP CHECK */

if(otp == generatedOTP){

/* SAVE DATA */

localStorage.setItem(
"streambox_username",
username
);

localStorage.setItem(
"streambox_email",
email
);

localStorage.setItem(
"streambox_password",
password
);

msg.innerHTML =
"✅ Account Created Successfully";

msg.style.color =
"#00ff66";

setTimeout(()=>{

window.location.href =
"LOGIN_PAGE.html";

},1500);

}

else{

msg.innerHTML =
"❌ Incorrect OTP";

msg.style.color =
"red";

}

}

</script>

</body>
</html>
